<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 07 - Items Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Item Management Dashboard</h1>
        </header>

        <div id="alert-box" class="alert"></div>

        <!-- Create / Edit Form Card -->
        <div class="card">
            <h2 id="form-title">Add New Item</h2>
            <form id="item-form">
                <input type="hidden" id="item-id" value="">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="item-name">Item Name</label>
                        <input type="text" id="item-name">
                    </div>
                    <div class="form-group">
                        <label for="item-price">Price</label>
                        <input type="number" id="item-price" step="0.01" min="0">
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="item-stock" checked>
                        <label for="item-stock">In Stock</label>
                    </div>
                </div>
                <button type="submit" id="submit-btn" class="btn btn-primary">Add Item</button>

            </form>
        </div>

        <div class="card">
            <div class="toolbar">
                <h2>Items List</h2>
            </div>

            <table id="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="items-tbody">
                    <!-- Data will be populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <script defer src="app.js"></script>
</body>
</html>
